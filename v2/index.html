<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Carearz 2.0: keep one base resume on your profile and turn any job description into a tailored resume and cover letter you can keep revising.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Carearz 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: application list on the left, the open application (documents + revision panel) on the right; one column with a back button on phones */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EDEB; --ink:#17212A; --muted:#5A6771; --line:#D8E0DD;
  --accent:#2A5C7C; --accent-soft:#DDE9F0; --accent-ink:#FFFFFF;
  --mark:#D99A1E; --mark-soft:#FBEFD3; --mark-ink:#5A3D00;
  --good:#2C7A4E; --good-soft:#DDF0E4; --danger:#B0423A; --danger-soft:#F7E1DE;
  --paper:#FFFFFF; --paper-ink:#1B2329;
  --f-ui:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-doc:"Newsreader", Georgia, "Times New Roman", serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,35,45,.06), 0 6px 24px rgba(20,35,45,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151A; --surface:#161F25; --sunk:#1C272E; --ink:#E4EBEF; --muted:#93A2AC; --line:#27343C;
  --accent:#7FB4D8; --accent-soft:#1D3341; --accent-ink:#0D161C;
  --mark:#E8B347; --mark-soft:#3A2E14; --mark-ink:#F6DDA2;
  --good:#6DC293; --good-soft:#173326; --danger:#E5867B; --danger-soft:#3A1E1B;
  --paper:#1A242B; --paper-ink:#E4EBEF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151A; --surface:#161F25; --sunk:#1C272E; --ink:#E4EBEF; --muted:#93A2AC; --line:#27343C;
  --accent:#7FB4D8; --accent-soft:#1D3341; --accent-ink:#0D161C;
  --mark:#E8B347; --mark-soft:#3A2E14; --mark-ink:#F6DDA2;
  --good:#6DC293; --good-soft:#173326; --danger:#E5867B; --danger-soft:#3A1E1B;
  --paper:#1A242B; --paper-ink:#E4EBEF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.sm{padding:4px 9px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-weight:600;font-size:14px}
.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px;min-width:0}
textarea.input{resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:13px;color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.brand small{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:calc(var(--r) + 2px)}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.save-state{font-size:12.5px;color:var(--muted)}

/* Shell */
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 48px}
.tailor{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:10px}
.app-list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 180px);overflow:auto}
.app-item{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:9px 11px;cursor:pointer}
.app-item:hover{background:var(--surface);border-color:var(--line)}
.app-item[aria-current="true"]{background:var(--surface);border-color:var(--accent)}
.app-item b{font-weight:600;font-size:14.5px}
.app-item span{font-size:13px;color:var(--muted)}
.app-item .meta{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.empty-list{font-size:13.5px;color:var(--muted);padding:6px 11px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:20px}
.notice{border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--mark-soft);color:var(--mark-ink)}
.notice.err{background:var(--danger-soft);color:var(--danger)}
.notice.ok{background:var(--good-soft);color:var(--good)}

/* New application */
.new-app h1{font-size:26px;letter-spacing:-.02em}
.new-app .lede{color:var(--muted);max-width:60ch}

/* Open application */
.app-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.app-head h1{font-size:24px;letter-spacing:-.02em}
.app-head .who{flex:1;min-width:0}
.app-head .who p{color:var(--muted)}
details.jd{margin-bottom:14px}
details.jd summary{cursor:pointer;color:var(--muted);font-size:14px}
details.jd pre{white-space:pre-wrap;font-family:var(--f-ui);font-size:13.5px;background:var(--sunk);border-radius:var(--r);padding:12px;max-height:320px;overflow:auto;margin:8px 0 0}

.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.doc-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.doc-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-right:auto}
.doc-tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.doc-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.versions{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.vchip{font-family:var(--f-num);font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer}
.vchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vchip.edited{border-style:dashed}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer;margin-left:6px}

.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:44px 52px;font-family:var(--f-doc);font-size:16px;line-height:1.5;min-height:420px;overflow-wrap:anywhere}
.paper h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0 0 2px}
.paper h2{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:3px;margin:20px 0 8px}
.paper h3{font-size:16.5px;font-weight:600;margin:12px 0 2px}
.paper p{margin:0 0 9px}
.paper ul{margin:2px 0 9px;padding-left:20px}
.paper li{margin:0 0 3px}
.paper hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.paper a{color:var(--accent)}
.paper.cover p{margin:0 0 14px;max-width:66ch}
.paper.streaming::after{content:"";display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.paper.diff{white-space:pre-wrap;font-size:15px}
.paper ins{background:var(--good-soft);color:var(--good);text-decoration:none;border-radius:2px}
.paper del{background:var(--danger-soft);color:var(--danger);border-radius:2px}
.paper textarea{width:100%;min-height:560px;border:0;background:transparent;font-family:var(--f-num);font-size:13.5px;line-height:1.55;resize:vertical;outline:none;color:inherit}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend ins{background:var(--good-soft);color:var(--good);text-decoration:none;padding:0 4px;border-radius:2px}
.legend del{background:var(--danger-soft);color:var(--danger);padding:0 4px;border-radius:2px}

/* Revision panel */
.revise{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:14px}
.revise h2{font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:6px 8px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.history{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);margin:0;padding:0}
.history li{list-style:none;display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.history li .n{font-family:var(--f-num);color:var(--muted)}
.history li button{all:unset;cursor:pointer}
.history li button:hover .t{text-decoration:underline}
.history li .t{display:block}
.history li .d{display:block;font-size:12px;color:var(--muted)}
.history ol{margin:0;padding:0}

/* Profile */
.profile{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.profile h1{font-size:26px;letter-spacing:-.02em}
.drop{border:1.5px dashed var(--line);border-radius:calc(var(--r) + 4px);padding:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bg);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block}
.drop .file{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.resume-text{min-height:420px;font-family:var(--f-num);font-size:13px}
.aside-card{display:flex;flex-direction:column;gap:10px}
.aside-card h2{font-size:15px}
.aside-card ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.back{display:none}

@media (max-width:1100px){
  .work{grid-template-columns:minmax(0,1fr)}
  .revise{position:static}
}
@media (max-width:820px){
  .tailor{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .tailor.has-open .side{display:none}
  .tailor:not(.has-open) .main{display:none}
  .tailor.is-new .main{display:block}
  .tailor.is-new .side{display:none}
  .back{display:inline-flex}
  .profile{grid-template-columns:minmax(0,1fr)}
  .paper{padding:24px 20px}
  .app-list{max-height:none}
}
@media (prefers-reduced-motion: reduce){ .spin,.paper.streaming::after{animation:none} }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Care<span>arz</span></b><small>2.0</small></div>
    <span class="save-state" id="saveState"></span>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-tailor" aria-selected="true" data-view="tailor">Applications</button>
      <button role="tab" id="tab-profile" aria-selected="false" data-view="profile">My resume</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
(() => {
"use strict";

/* ---------- Helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = t => new Date(t).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
const fmtTime = t => new Date(t).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function loadScript(src){
  return new Promise((ok, fail) => {
    if ([...document.scripts].some(s => s.src === src)) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = () => ok(); s.onerror = () => fail(new Error("Could not load " + src));
    document.head.appendChild(s);
  });
}

/* ---------- State ---------- */
const S = {
  view:"tailor",
  profile:{name:"", resume:"", fileName:"", updatedAt:0},
  apps:[],             // {id, company, role, jd, focus, createdAt, updatedAt, versions:[...]}
  sel:null,            // open application id, or "new"
  doc:"resume",        // resume | cover | notes
  ver:null,            // index into versions; null = latest
  compare:false,
  editing:false,
  target:"both",
  busy:null,           // {appId, kind, text}
  error:"",
  draftJd:"", draftFocus:"", draftReq:"",
  keyOpen:false
};
const curApp = () => S.apps.find(a => a.id === S.sel) || null;

/* ---------- Storage: private per-person db when opened in Claude, else this browser ---------- */
const Store = {
  mode:"local", root:null, timers:{},
  local(key, val){
    try{
      if (val === undefined){ const v = localStorage.getItem("carearz2:" + key); return v ? JSON.parse(v) : null; }
      localStorage.setItem("carearz2:" + key, JSON.stringify(val));
    }catch(e){ return null; }
  },
  async init(){
    try{
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.root = db.doc("data/users/" + id + "/profile");
      this.mode = "cloud";
    }catch(e){ this.mode = "local"; }
  },
  async loadCloud(){
    const [p, a] = await Promise.all([this.root.get(), this.root.collection("apps").get()]);
    const apps = await Promise.all(a.docs.map(async d => {
      const app = {...d.data()};
      const vs = await this.root.collection("apps").doc(d.id).collection("versions").get();
      app.versions = vs.docs.map(v => ({...v.data()})).sort((x, y) => x.n - y.n);
      return app;
    }));
    return {profile: p.exists ? p.data()?.profile : null, apps};
  },
  saveProfile(){
    this.local("profile", S.profile);
    if (this.mode !== "cloud") return Promise.resolve();
    return this.root.set({profile: JSON.parse(JSON.stringify(S.profile))});
  },
  appMeta(app){ const {versions, ...meta} = app; return JSON.parse(JSON.stringify(meta)); },
  async putApp(app, newVersion){
    this.local("apps", S.apps);
    if (this.mode !== "cloud") return;
    const ref = this.root.collection("apps").doc(app.id);
    try{
      await ref.set(this.appMeta(app));
      if (newVersion) await ref.collection("versions").doc(newVersion.id).set(JSON.parse(JSON.stringify(newVersion)));
    }catch(e){ console.warn(e); toast("Couldn't save to your account. It is kept in this browser for now."); }
  },
  async delApp(app){
    this.local("apps", S.apps);
    if (this.mode !== "cloud") return;
    const ref = this.root.collection("apps").doc(app.id);
    try{
      await Promise.all(app.versions.map(v => ref.collection("versions").doc(v.id).delete()));
      await ref.delete();
    }catch(e){ console.warn(e); }
  }
};

/* ---------- Claude: inside Claude use the page's own access; elsewhere (e.g. GitHub Pages) use your own API key ---------- */
const API_MODEL = "claude-sonnet-5-5";
const Caps = {native:null, key(){ try{ return localStorage.getItem("carearz2:apikey") || localStorage.getItem("carearz:apikey") || ""; }catch(_){ return ""; } }};
async function nativeSample(){
  if (Caps.native === null) Caps.native = window.claude?.use ? (await claude.use("sample")) || false : false;
  return Caps.native || null;
}
function apiSample(){
  const key = Caps.key();
  if (!key) return null;
  return async (input, opts = {}) => {
    let res;
    try{
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", signal:opts.signal,
        headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:API_MODEL, max_tokens:8000, stream:true, messages:[{role:"user", content:input}]})
      });
    }catch(e){ throw {code: e?.name === "AbortError" ? "cancelled" : "upstream_error", message:String(e)}; }
    if (!res.ok){
      const body = await res.text().catch(() => "");
      throw {code: res.status === 401 || res.status === 403 ? "bad_key" : res.status === 429 ? "rate_limited" : "upstream_error", message:body};
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "", truncated = false;
    for (;;){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines){
        if (!line.startsWith("data:")) continue;
        let ev; try{ ev = JSON.parse(line.slice(5)); }catch(_){ continue; }
        if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta"){
          text += ev.delta.text;
          try{ opts.onText?.({text, delta:ev.delta.text}); }catch(_){}
        } else if (ev.type === "message_delta" && ev.delta?.stop_reason === "max_tokens") truncated = true;
        else if (ev.type === "error") throw {code:"upstream_error", message:ev.error?.message || "", text};
      }
    }
    return {text, truncated};
  };
}
async function getSample(){ return (await nativeSample()) || apiSample(); }
async function getDownloads(){
  const d = window.claude?.use ? await claude.use("downloads") : null;
  if (d) return d;
  return {save: async ({filename, data}) => {
    const blob = data instanceof Blob ? data : new Blob([data], {type:"text/plain;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return {status:"saved"};
  }};
}
function errText(e){
  const c = e?.code;
  if (c === "bad_key") return "Anthropic didn't accept that API key. Check it under My resume.";
  if (c === "rate_limited") return "Claude is busy or you've hit a usage limit. Wait a minute and try again.";
  if (c === "not_granted") return "This page wasn't allowed to use Claude. Allow it from the page's permissions, then try again.";
  if (c === "cancelled") return "Stopped.";
  if (c === "prompt_too_large") return "Your resume and the job description are too long together. Trim the job description to the role and requirements.";
  return "Something went wrong talking to Claude. Try again." + (e?.message ? " (" + String(e.message).slice(0, 140) + ")" : "");
}

/* ---------- Prompts ---------- */
const RULES = `Rules you must follow:
- Use only facts from the candidate's base resume (and anything the candidate tells you in their requests). Never invent employers, job titles, dates, degrees, certifications, tools, numbers or achievements. You may reword, reorder, regroup, merge and cut.
- Mirror the job description's language and priorities wherever the candidate's real experience supports it, so the resume reads well to a recruiter and to applicant tracking systems.
- Resume format, in Markdown: "# Full Name" on the first line, then one plain line of contact details separated by " | ", then sections as "## Section" (for example Summary, Experience, Skills, Education). Each job is "### Title, Company | Location | Dates" followed by "- " bullets. Use **bold** sparingly. No tables, no images, no HTML. Aim for one page of content for early-career candidates and at most two pages otherwise.
- Cover letter format: plain paragraphs separated by blank lines. Open with a greeting to the hiring team or manager at the company (use a name only if the job description gives one), 250 to 400 words, specific to this role and company, closing with "Sincerely," and the candidate's name on the next line. No date or address block. Don't use bracketed placeholders unless something essential is missing.
- Fit notes: 3 to 6 short "- " bullets covering how well the candidate fits, real gaps against the requirements, and what you chose to emphasize.`;

function genPrompt(profile, jd, focus){
  return `You are an expert resume writer and career coach. Tailor the candidate's base resume to the job below and write a matching cover letter.

${RULES}

<base_resume>
${profile.resume}
</base_resume>

<job_description>
${jd}
</job_description>
${focus ? `\n<candidate_request>\n${focus}\n</candidate_request>\n` : ""}
Reply in exactly this format and nothing else:
<company>company name from the job description</company>
<role>job title from the job description</role>
<resume>
the tailored resume in Markdown
</resume>
<cover_letter>
the cover letter
</cover_letter>
<notes>
the fit notes
</notes>`;
}

function revisePrompt(profile, app, cur, request, target){
  const earlier = app.versions.filter(v => v.request).map(v => `- v${v.n}: ${v.request}`).join("\n");
  const which = target === "resume" ? "the resume only" : target === "cover" ? "the cover letter only" : "both the resume and the cover letter";
  const tags = target === "resume" ? "<resume>…</resume>" : target === "cover" ? "<cover_letter>…</cover_letter>" : "<resume>…</resume>\n<cover_letter>…</cover_letter>";
  return `You are an expert resume writer revising a tailored resume and cover letter at the candidate's request.

${RULES}

<base_resume>
${profile.resume}
</base_resume>

<job_description>
${app.jd}
</job_description>
${earlier ? `\n<earlier_requests>\n${earlier}\n</earlier_requests>\n` : ""}
<current_resume>
${cur.resume}
</current_resume>

<current_cover_letter>
${cur.cover}
</current_cover_letter>

<request>
${request}
</request>

Apply the request to ${which}. Keep everything the request doesn't touch as it is, and keep honoring the earlier requests unless this one overrides them. Return the complete revised document${target === "both" ? "s" : ""}, not a diff.

Reply in exactly this format and nothing else:
<summary>one sentence on what you changed</summary>
${tags}`;
}

function tag(text, name){
  const m = text.match(new RegExp("<" + name + ">\\s*([\\s\\S]*?)\\s*(?:</" + name + ">|$)"));
  return m ? m[1].trim() : "";
}
const hasTag = (text, name) => text.includes("<" + name + ">");

/* ---------- Markdown (the small subset the prompts ask for) ---------- */
function inline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function blocks(md){
  const out = []; let para = [], list = [];
  const flushP = () => { if (para.length){ out.push({t:"p", text:para.join(" ")}); para = []; } };
  const flushL = () => { if (list.length){ out.push({t:"ul", items:list}); list = []; } };
  for (const raw of String(md || "").split("\n")){
    const line = raw.trimEnd();
    let m;
    if (!line.trim()){ flushP(); flushL(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))){ flushP(); flushL(); out.push({t:"h" + m[1].length, text:m[2]}); continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)){ flushP(); flushL(); out.push({t:"hr"}); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))){ flushP(); list.push(m[1]); continue; }
    flushL(); para.push(line.trim());
  }
  flushP(); flushL();
  return out;
}
function mdToHtml(md){
  return blocks(md).map(b =>
    b.t === "ul" ? "<ul>" + b.items.map(i => "<li>" + inline(i) + "</li>").join("") + "</ul>" :
    b.t === "hr" ? "<hr>" :
    `<${b.t}>${inline(b.text)}</${b.t}>`).join("");
}

/* ---------- Word-level diff ---------- */
function diffHtml(a, b){
  const A = String(a || "").split(/(\s+)/), B = String(b || "").split(/(\s+)/);
  const n = A.length, m = B.length;
  if (n * m > 6e6) return esc(b);
  const dp = Array.from({length:n + 1}, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i = 0, j = 0, out = "", ins = "", del = "";
  const flush = () => { if (del) out += "<del>" + esc(del) + "</del>"; if (ins) out += "<ins>" + esc(ins) + "</ins>"; ins = del = ""; };
  while (i < n && j < m){
    if (A[i] === B[j]){ flush(); out += esc(A[i]); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) del += A[i++];
    else ins += B[j++];
  }
  while (i < n) del += A[i++];
  while (j < m) ins += B[j++];
  flush();
  return out;
}

/* ---------- File reading: PDF, Word, text ---------- */
const LIB = {
  pdf:"https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
  pdfWorker:"https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js",
  mammoth:"https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js",
  docx:"https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"
};
async function readPdf(buf){
  // Loading the worker script on the page lets pdf.js run in the page itself, with no separate worker
  await loadScript(LIB.pdf); await loadScript(LIB.pdfWorker);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const pdf = await lib.getDocument({data:buf, disableWorker:true}).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const content = await (await pdf.getPage(p)).getTextContent();
    let lastY = null, line = "", lines = [];
    for (const it of content.items){
      const y = it.transform ? Math.round(it.transform[5]) : lastY;
      if (lastY !== null && Math.abs(y - lastY) > 2 && line.trim()){ lines.push(line); line = ""; }
      line += it.str; if (it.hasEOL && line.trim()){ lines.push(line); line = ""; }
      lastY = y;
    }
    if (line) lines.push(line);
    pages.push(lines.map(l => l.replace(/\s+/g, " ").trim()).join("\n"));
  }
  return pages.join("\n\n");
}
async function readDocx(buf){
  await loadScript(LIB.mammoth);
  const r = await window.mammoth.extractRawText({arrayBuffer:buf});
  return r.value;
}
async function readResumeFile(file){
  const name = file.name.toLowerCase();
  if (name.endsWith(".pdf")) return readPdf(await file.arrayBuffer());
  if (name.endsWith(".docx")) return readDocx(await file.arrayBuffer());
  if (name.endsWith(".doc")) throw new Error("Older .doc files can't be read here. Save it as .docx or PDF and upload that.");
  return file.text();
}
const tidy = t => String(t || "").replace(/\r/g, "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();

/* ---------- Export ---------- */
async function toDocx(md, kind){
  await loadScript(LIB.docx);
  const D = window.docx;
  const runs = (s, base = {}) => {
    const parts = []; const re = /\*\*(.+?)\*\*|\*(?!\s)(.+?)\*/g; let last = 0, m;
    while ((m = re.exec(s))){
      if (m.index > last) parts.push(new D.TextRun({text:s.slice(last, m.index), ...base}));
      parts.push(new D.TextRun({text:m[1] || m[2], bold:!!m[1] || base.bold, italics:!!m[2], size:base.size, font:base.font}));
      last = re.lastIndex;
    }
    if (last < s.length) parts.push(new D.TextRun({text:s.slice(last), ...base}));
    return parts;
  };
  const strip = s => s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
  const font = "Calibri";
  const kids = [];
  for (const b of blocks(md)){
    if (b.t === "h1") kids.push(new D.Paragraph({children:runs(strip(b.text), {bold:true, size:36, font}), spacing:{after:40}}));
    else if (b.t === "h2") kids.push(new D.Paragraph({children:runs(strip(b.text).toUpperCase(), {bold:true, size:22, font}), spacing:{before:220, after:80}, border:{bottom:{color:"999999", space:1, style:D.BorderStyle.SINGLE, size:6}}}));
    else if (b.t === "h3") kids.push(new D.Paragraph({children:runs(strip(b.text), {bold:true, size:22, font}), spacing:{before:120, after:40}}));
    else if (b.t === "ul") for (const it of b.items) kids.push(new D.Paragraph({children:runs(strip(it), {size:21, font}), bullet:{level:0}, spacing:{after:40}}));
    else if (b.t === "hr") kids.push(new D.Paragraph({children:[]}));
    else kids.push(new D.Paragraph({children:runs(strip(b.text), {size: kind === "cover" ? 22 : 21, font}), spacing:{after: kind === "cover" ? 200 : 80}}));
  }
  const doc = new D.Document({sections:[{properties:{page:{margin:{top:900, bottom:900, left:1000, right:1000}}}, children:kids}]});
  return D.Packer.toBlob(doc);
}
function fileBase(app, kind){
  const who = (S.profile.name || "").trim();
  const parts = [who, app.company, kind === "cover" ? "Cover letter" : kind === "notes" ? "Fit notes" : "Resume"].filter(Boolean);
  return parts.join(" - ").replace(/[\\/:*?"<>|]+/g, "").slice(0, 120);
}

/* ---------- Generation ---------- */
let aborter = null;
async function generate(){
  const jd = S.draftJd.trim();
  if (!S.profile.resume.trim()){ S.error = "Add your base resume under My resume first."; return render(); }
  if (jd.length < 80){ S.error = "Paste the full job description, including the responsibilities and requirements."; return render(); }
  const sample = await getSample();
  if (!sample){ S.error = "To generate here, add your Claude API key under My resume. Inside the Claude app this works without a key."; return render(); }
  const app = {id:uid(), company:"", role:"", jd, focus:S.draftFocus.trim(), createdAt:Date.now(), updatedAt:Date.now(), versions:[]};
  S.apps.unshift(app); S.sel = app.id; S.doc = "resume"; S.ver = null; S.compare = false; S.editing = false; S.error = "";
  S.busy = {appId:app.id, kind:"generate", text:""};
  render();
  aborter = new AbortController();
  try{
    const {text, truncated} = await sample(genPrompt(S.profile, jd, app.focus), {
      signal:aborter.signal, cache:false, modelTier:"default",
      onText:({text}) => { S.busy.text = text; paintStream(); }
    });
    const resume = tag(text, "resume"), cover = tag(text, "cover_letter");
    if (!resume || !cover) throw {code:"upstream_error", message: truncated ? "The reply was cut off." : "The reply was missing a document."};
    app.company = tag(text, "company") || "Untitled company";
    app.role = tag(text, "role") || "Role";
    const v = {id:uid(), n:1, resume, cover, notes:tag(text, "notes"), request:"", target:"both", by:"claude", at:Date.now()};
    app.versions.push(v); app.updatedAt = v.at;
    S.draftJd = ""; S.draftFocus = "";
    Store.putApp(app, v);
  }catch(e){
    S.apps = S.apps.filter(a => a !== app); S.sel = "new"; S.error = errText(e);
  }finally{ S.busy = null; aborter = null; render(); }
}

async function revise(request){
  const app = curApp(); if (!app) return;
  request = request.trim();
  if (!request){ S.error = "Say what you'd like changed."; return render(); }
  const sample = await getSample();
  if (!sample){ S.error = "To revise here, add your Claude API key under My resume."; return render(); }
  const base = S.ver === null ? app.versions[app.versions.length - 1] : app.versions[S.ver];
  const target = S.target;
  S.busy = {appId:app.id, kind:"revise", text:"", target}; S.error = ""; S.editing = false; S.compare = false; S.ver = null;
  if (target === "resume") S.doc = "resume"; else if (target === "cover") S.doc = "cover"; else if (S.doc === "notes") S.doc = "resume";
  render();
  aborter = new AbortController();
  try{
    const {text, truncated} = await sample(revisePrompt(S.profile, app, base, request, target), {
      signal:aborter.signal, cache:false, modelTier:"default",
      onText:({text}) => { S.busy.text = text; paintStream(); }
    });
    const resume = target === "cover" ? base.resume : tag(text, "resume");
    const cover = target === "resume" ? base.cover : tag(text, "cover_letter");
    if (!resume || !cover) throw {code:"upstream_error", message: truncated ? "The reply was cut off." : "The reply was missing a document."};
    const v = {id:uid(), n:app.versions.length + 1, resume, cover, notes:base.notes, request, summary:tag(text, "summary"), target, by:"claude", at:Date.now(), from:base.n};
    app.versions.push(v); app.updatedAt = v.at;
    S.draftReq = "";
    Store.putApp(app, v);
    S.apps.sort((a, b) => b.updatedAt - a.updatedAt);
  }catch(e){ S.error = errText(e); }
  finally{ S.busy = null; aborter = null; render(); }
}

function saveManualEdit(text){
  const app = curApp(); if (!app) return;
  const base = S.ver === null ? app.versions[app.versions.length - 1] : app.versions[S.ver];
  const key = S.doc === "cover" ? "cover" : "resume";
  if (text.trim() === base[key].trim()){ S.editing = false; return render(); }
  const v = {...base, id:uid(), n:app.versions.length + 1, [key]:text, request:"", summary:`Edited the ${key === "cover" ? "cover letter" : "resume"} by hand`, target:key, by:"you", at:Date.now(), from:base.n};
  app.versions.push(v); app.updatedAt = v.at;
  S.editing = false; S.ver = null;
  Store.putApp(app, v);
  toast("Saved as v" + v.n);
  render();
}

      <b>${esc(a.company || "Writing…")}</b><span>${esc(a.role || "Reading the job description")}</span>

function streamingDoc(){
  const t = S.busy.text;
  if (S.busy.kind === "generate"){
    if (hasTag(t, "cover_letter") && S.doc === "cover") return {kind:"cover", md:tag(t, "cover_letter")};
    if (hasTag(t, "resume")) return {kind:"resume", md:tag(t, "resume")};
    return {kind:"resume", md:""};
  }
  if (S.busy.target === "cover" || (S.busy.target === "both" && hasTag(t, "cover_letter") && S.doc === "cover")) return {kind:"cover", md:tag(t, "cover_letter")};
  return {kind:"resume", md:tag(t, "resume")};
}

function viewApp(app){
  const busy = S.busy?.appId === app.id;
  const vs = app.versions;
  const idx = S.ver === null ? vs.length - 1 : S.ver;
  const v = vs[idx];
  const prev = v && v.from ? vs.find(x => x.n === v.from) : vs[idx - 1];
  const docLabel = {resume:"Resume", cover:"Cover letter", notes:"Fit notes"};
  let body;
  if (busy){
    const s = streamingDoc();
    body = `<div class="paper ${s.kind === "cover" ? "cover" : ""} streaming" id="paper">${s.md ? mdToHtml(s.md) : '<p class="muted">' + (S.busy.kind === "generate" ? "Reading the job description and your resume…" : "Revising…") + "</p>"}</div>`;
  } else if (!v){
    body = `<div class="paper"><p class="muted">No documents yet.</p></div>`;
  } else if (S.editing && S.doc !== "notes"){
    body = `<div class="paper"><textarea id="editor" aria-label="Edit ${docLabel[S.doc]}">${esc(S.doc === "cover" ? v.cover : v.resume)}</textarea></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-act="save-edit">Save as new version</button><button class="btn ghost" data-act="cancel-edit">Cancel</button><span class="hint">Markdown: # name, ## section, ### job, - bullet, **bold**</span></div>`;
  } else if (S.compare && prev && S.doc !== "notes"){
    const k = S.doc === "cover" ? "cover" : "resume";
    body = `<div class="legend"><span>Changes from v${prev.n} to v${v.n}:</span><del>removed</del><ins>added</ins></div>
      <div class="paper diff">${prev[k] === v[k] ? '<span class="muted">No changes to this document in this version.</span>' : diffHtml(prev[k], v[k])}</div>`;
  } else {
    const md = S.doc === "cover" ? v.cover : S.doc === "notes" ? (v.notes || "No notes for this version.") : v.resume;
    body = `<div class="paper ${S.doc === "cover" ? "cover" : ""}">${mdToHtml(md)}</div>`;
  }

  const chips = vs.map((x, i) => `<button class="vchip ${x.by === "you" ? "edited" : ""}" data-ver="${i}" aria-pressed="${i === idx && !busy}" title="${esc(x.request || x.summary || "First draft")}">v${x.n}</button>`).join("");
  const history = vs.slice().reverse().map(x => {
    const i = vs.indexOf(x);
    const what = x.n === 1 ? "First draft" : x.by === "you" ? (x.summary || "Edited by hand") : x.request;
    const sub = x.summary && x.by !== "you" ? x.summary : "";
    return `<li><span class="n">v${x.n}</span><button data-ver="${i}"><span class="t">${esc(what)}</span>${sub ? `<span class="d">${esc(sub)}</span>` : ""}<span class="d">${fmtTime(x.at)}${x.target && x.target !== "both" && x.n > 1 ? " · " + (x.target === "cover" ? "cover letter" : "resume") : ""}</span></button></li>`;
  }).join("");

  return `
  <div><button class="btn ghost sm back" data-act="list">← Applications</button></div>
  <div class="app-head">
    <div class="who"><h1>${esc(app.company || "Writing…")}</h1><p>${esc(app.role || "")}${app.createdAt ? " · started " + fmtDate(app.createdAt) : ""}</p></div>
    <div class="row">${busy ? `<button class="btn" data-act="stop"><span class="spin"></span> Stop</button>` : `<button class="btn ghost danger sm" data-act="delete">Delete</button>`}</div>
  </div>
  <div id="confirmDel"></div>
  <details class="jd"><summary>Job description${app.focus ? " and your note" : ""}</summary>${app.focus ? `<p class="hint" style="margin-top:8px">Your note: ${esc(app.focus)}</p>` : ""}<pre>${esc(app.jd)}</pre></details>
  ${S.error ? `<div class="notice err" role="alert" style="margin-bottom:12px">${esc(S.error)}</div>` : ""}
  <div class="work">
    <section>
      <div class="doc-bar">
        <div class="doc-tabs" role="tablist" aria-label="Document">
          ${["resume","cover","notes"].map(k => `<button role="tab" data-doc="${k}" aria-selected="${S.doc === k}">${docLabel[k]}</button>`).join("")}
        </div>
        ${v && !busy && S.doc !== "notes" && !S.editing ? `<button class="btn sm" data-act="copy">Copy</button><button class="btn sm" data-act="dl-docx">Word</button><button class="btn sm" data-act="dl-md">Markdown</button><button class="btn sm" data-act="edit">Edit</button>` : ""}
      </div>
      ${vs.length && !busy ? `<div class="versions"><span class="label" style="margin-right:4px">Version</span>${chips}
        ${prev && S.doc !== "notes" && !S.editing ? `<label class="toggle"><input type="checkbox" id="compare" ${S.compare ? "checked" : ""}> Show changes from v${prev.n}</label>` : ""}</div>` : ""}
      ${body}
    </section>
    <aside class="revise">
      <section class="panel stack">
        <h2>Ask for changes</h2>
        <div class="seg" role="group" aria-label="Apply to">
          ${[["both","Both"],["resume","Resume"],["cover","Cover letter"]].map(([k, l]) => `<button data-target="${k}" aria-pressed="${S.target === k}">${l}</button>`).join("")}
        </div>
        <textarea class="input" id="req" rows="4" placeholder="e.g. Put the data analysis project first and mention I can start in two weeks">${esc(S.draftReq)}</textarea>
        <div class="chips">${QUICK.map(q => `<button class="chip" data-quick="${esc(q)}">${esc(q)}</button>`).join("")}</div>
        <button class="btn primary" data-act="revise" ${busy || !v ? "disabled" : ""}>${busy ? '<span class="spin"></span> Working…' : `Revise${S.ver !== null && S.ver !== vs.length - 1 ? " from v" + v.n : ""}`}</button>
        <p class="hint">Each revision is saved as a new version, so you can always go back.</p>
      </section>
      ${vs.length ? `<section class="panel stack"><h2>History</h2><ol class="history">${history}</ol></section>` : ""}
    </aside>
  </div>`;
}

// Repaint only the document while Claude is writing, so typing in the side panel isn't interrupted
function paintStream(){
  const el = $("#paper");
  if (!el || !S.busy) return;
  const s = streamingDoc();
  el.classList.toggle("cover", s.kind === "cover");
  if (s.md) el.innerHTML = mdToHtml(s.md);
}

/* ---------- Events ---------- */
function wire(){
  const on = (sel, ev, fn) => $$(sel, root).forEach(el => el.addEventListener(ev, fn));
  // keep drafts as people type
  const jd = $("#jd"), focus = $("#focus"), req = $("#req");
  jd?.addEventListener("input", () => { S.draftJd = jd.value; Store.local("draft", {jd:S.draftJd, focus:S.draftFocus}); });
  focus?.addEventListener("input", () => { S.draftFocus = focus.value; Store.local("draft", {jd:S.draftJd, focus:S.draftFocus}); });
  req?.addEventListener("input", () => { S.draftReq = req.value; });
  req?.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) revise(req.value); });

  on("[data-open]", "click", e => { S.sel = e.currentTarget.dataset.open; S.ver = null; S.compare = false; S.editing = false; S.error = ""; render(); window.scrollTo(0, 0); });
  on("[data-doc]", "click", e => { S.doc = e.currentTarget.dataset.doc; S.editing = false; render(); });
  on("[data-ver]", "click", e => { const i = +e.currentTarget.dataset.ver; const app = curApp(); S.ver = i === app.versions.length - 1 ? null : i; S.editing = false; render(); });
  on("[data-target]", "click", e => { S.target = e.currentTarget.dataset.target; render(); });
  on("[data-quick]", "click", e => {
    const q = e.currentTarget.dataset.quick;
    S.draftReq = S.draftReq.trim() ? S.draftReq.trim().replace(/[.]?$/, ". ") + q : q;
    render(); $("#req")?.focus();
  });
  $("#compare")?.addEventListener("change", e => { S.compare = e.target.checked; render(); });

  on("[data-act]", "click", async e => {
    const act = e.currentTarget.dataset.act;
    const app = curApp();
    const v = app ? (S.ver === null ? app.versions[app.versions.length - 1] : app.versions[S.ver]) : null;
    const text = v ? (S.doc === "cover" ? v.cover : v.resume) : "";
    switch (act){
      case "new": S.sel = "new"; S.error = ""; return render();
      case "list": S.sel = null; S.error = ""; return render();
      case "go-profile": S.view = "profile"; return render();
      case "generate": return generate();
      case "revise": return revise(S.draftReq);
      case "stop": aborter?.abort(); return;
      case "edit": S.editing = true; S.compare = false; return render();
      case "cancel-edit": S.editing = false; return render();
      case "save-edit": return saveManualEdit($("#editor").value);
      case "copy":
        try{ await navigator.clipboard.writeText(text); toast("Copied"); }
        catch(_){ toast("Couldn't copy. Use Edit and select the text instead."); }
        return;
      case "dl-md": case "dl-docx": {
        try{
          const dl = await getDownloads();
          const docx = act === "dl-docx";
          const data = docx ? await toDocx(text, S.doc) : text;
          const r = await dl.save({filename:fileBase(app, S.doc) + (docx ? ".docx" : ".md"), data});
          if (r?.status === "saved" || r === undefined) toast("Downloaded");
        }catch(err){ if (err?.code !== "declined") toast(err?.code === "unavailable" ? "Downloads aren't available here. Use Copy instead." : "Couldn't create the file. Use Copy instead."); }
        return;
      }
      case "delete":
        $("#confirmDel").innerHTML = `<div class="notice err row" style="margin-bottom:12px">Delete ${esc(app.company)} and all ${app.versions.length} version${app.versions.length === 1 ? "" : "s"}? <button class="btn sm danger" data-confirm="yes">Delete</button><button class="btn sm ghost" data-confirm="no">Keep</button></div>`;
        $$("[data-confirm]").forEach(b => b.addEventListener("click", () => {
          if (b.dataset.confirm === "yes"){ S.apps = S.apps.filter(a => a !== app); S.sel = null; Store.delApp(app); toast("Deleted"); render(); }
          else $("#confirmDel").innerHTML = "";
        }));
        return;
      case "save-profile": {
        S.profile.name = $("#pname").value.trim();
        S.profile.resume = tidy($("#ptext").value);
        S.profile.updatedAt = Date.now();
        try{ await Store.saveProfile(); toast("Saved to your profile"); }
        catch(err){ console.warn(err); toast("Saved in this browser. Couldn't reach your account."); }
        return render();
      }
      case "save-key": try{ localStorage.setItem("carearz2:apikey", $("#apiKey").value.trim()); toast("Key saved in this browser"); }catch(_){ toast("This browser blocked saving the key."); } return render();
      case "clear-key": try{ localStorage.removeItem("carearz2:apikey"); localStorage.removeItem("carearz:apikey"); }catch(_){} return render();
    }
  });

  // Resume upload
  const file = $("#file"), drop = $("#drop");
  const take = async f => {
    if (!f) return;
    const st = $("#pstatus"); st.innerHTML = '<span class="spin"></span> Reading ' + esc(f.name) + "…";
    try{
      const text = tidy(await readResumeFile(f));
      if (text.length < 200) throw new Error("Couldn't find much text in that file. If it's a scanned image, paste the text instead.");
      S.profile.resume = text; S.profile.fileName = f.name; S.profile.updatedAt = Date.now();
      if (!S.profile.name){ const first = text.split("\n").find(l => l.trim()); if (first && first.length < 60 && !/@|\d{3}/.test(first)) S.profile.name = first.replace(/^#\s*/, "").trim(); }
      try{ await Store.saveProfile(); }catch(_){}
      render();
      $("#pstatus").textContent = "Read " + f.name + " and saved it to your profile. Check the text below.";
    }catch(err){ st.textContent = err.message || "Couldn't read that file."; }
  };
  file?.addEventListener("change", () => take(file.files[0]));
  if (drop){
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files[0]); });
  }
}

$$(".tabs button").forEach(b => b.addEventListener("click", () => { S.touched = true; S.view = b.dataset.view; S.error = ""; render(); }));

/* ---------- Boot ---------- */
async function boot(){
  const p = Store.local("profile"); if (p) S.profile = {...S.profile, ...p};
  const a = Store.local("apps"); if (Array.isArray(a)) S.apps = a;
  const d = Store.local("draft"); if (d){ S.draftJd = d.jd || ""; S.draftFocus = d.focus || ""; }
  if (!S.profile.resume) S.view = "profile";
  render();
  await Store.init();
  if (Store.mode === "cloud"){
    try{
      const c = await Store.loadCloud();
      if (c.profile) S.profile = {...S.profile, ...c.profile};
      else if (S.profile.resume) Store.saveProfile().catch(() => {});
      if (c.apps.length) S.apps = c.apps.sort((x, y) => y.updatedAt - x.updatedAt);
      if (S.profile.resume && S.view === "profile" && !S.touched) S.view = "tailor";
    }catch(e){ console.warn(e); Store.mode = "local"; }
  }
  await nativeSample();
  if (!S.busy) render();
}
boot();
})();
</script>
