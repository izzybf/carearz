<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Carearz 2.0: keep one base resume on your profile and turn any job description into a tailored resume and cover letter you can keep revising.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Carearz 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Showroom look: warm off-white ground, white rounded cards, cobalt / tomato / mustard blocks, pill controls, lowercase labels.
   Layout: application list on the left, the open application (documents + revision panel) on the right; one column with a back button on phones */
:root{
  --bg:#F3EFE7; --surface:#FFFFFF; --sunk:#EAE4D8; --ink:#1E1E1E; --muted:#5E584E; --line:#E0D9CC;
  --accent:#2F45C5; --accent-soft:#DDE2F7; --accent-ink:#FFFFFF;
  --tomato:#E2533A; --mustard:#EDB72E; --sage:#9DBE8C; --on-block:#1E1E1E;
  --mark:#D99A1E; --mark-soft:#FBEFD3; --mark-ink:#5A3D00;
  --good:#2C7A4E; --good-soft:#DDF0E4; --danger:#B0423A; --danger-soft:#F7E1DE;
  --paper:#FFFFFF; --paper-ink:#1B1B1B;
  --f-ui:"DM Sans", "Helvetica Neue", Arial, sans-serif;
  --f-doc:"DM Sans", "Helvetica Neue", Arial, sans-serif;
  --f-num:"DM Sans", "Helvetica Neue", Arial, sans-serif;
  --f-code:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px; --r-lg:24px; --shadow:0 1px 2px rgba(40,30,10,.05), 0 8px 28px rgba(40,30,10,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1916; --surface:#26241F; --sunk:#312E27; --ink:#F3EFE7; --muted:#B8B0A2; --line:#3B382F;
  --accent:#8E9CF2; --accent-soft:#2A3060; --accent-ink:#12142A;
  --tomato:#F0735C; --mustard:#EDB72E; --sage:#A9C99A;
  --mark:#E8B347; --mark-soft:#3A2E14; --mark-ink:#F6DDA2;
  --good:#6DC293; --good-soft:#173326; --danger:#E5867B; --danger-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1916; --surface:#26241F; --sunk:#312E27; --ink:#F3EFE7; --muted:#B8B0A2; --line:#3B382F;
  --accent:#8E9CF2; --accent-soft:#2A3060; --accent-ink:#12142A;
  --tomato:#F0735C; --mustard:#EDB72E; --sage:#A9C99A;
  --mark:#E8B347; --mark-soft:#3A2E14; --mark-ink:#F6DDA2;
  --good:#6DC293; --good-soft:#173326; --danger:#E5867B; --danger-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:13px;color:var(--muted);font-weight:700;text-transform:lowercase}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--sunk);border-radius:999px;padding:10px 18px;min-height:40px;cursor:pointer;font-weight:700;white-space:nowrap;text-transform:lowercase}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 14px;min-height:34px;font-size:13.5px}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-weight:700;font-size:14px}
.input,textarea.input{width:100%;border:2px solid transparent;background:var(--surface);border-radius:var(--r);padding:10px 13px;min-width:0}
.panel .input,.panel textarea.input{background:var(--bg)}
textarea.input{resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);outline:none}
.hint{font-size:13px;color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top-in{display:flex;align-items:center;gap:16px;padding:16px 20px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mk{display:inline-flex;align-items:center}
.brand .mk i{width:28px;height:28px;border-radius:50%;background:var(--tomato)}
.brand .mk i + i{border-radius:7px;background:var(--accent);margin-left:-12px}
.brand b{font-size:24px;font-weight:800;letter-spacing:-.03em;text-transform:lowercase}
.brand b span{color:inherit}
.brand small{font-size:12px;font-weight:700;background:var(--mustard);color:var(--on-block);border-radius:999px;padding:2px 8px}
.tabs{display:flex;gap:4px;background:var(--surface);padding:5px;border-radius:999px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--ink);text-transform:lowercase;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.save-state{font-size:12.5px;color:var(--muted)}

/* Shell */
.wrap{max-width:1400px;margin:0 auto;padding:12px 20px 48px}
.tailor{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:10px}
.side > .btn.primary{min-height:52px;font-size:15px}
.app-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 200px);overflow:auto;padding:2px}
.app-item{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:14px 16px;cursor:pointer}
.app-item:hover{box-shadow:var(--shadow)}
.app-item[aria-current="true"]{background:var(--mustard);color:var(--on-block)}
.app-item[aria-current="true"] span{color:var(--on-block)}
.app-item b{font-weight:700;font-size:15.5px}
.app-item span{font-size:13px;color:var(--muted)}
.app-item .meta{font-size:12px}
.empty-list{font-size:13.5px;color:var(--muted);padding:6px 4px}

.panel{background:var(--surface);border:0;border-radius:var(--r-lg);padding:24px}
.panel h2{text-transform:lowercase}
.notice{border-radius:var(--r);padding:12px 16px;font-size:14px;background:var(--mark-soft);color:var(--mark-ink)}
.notice.err{background:var(--danger-soft);color:var(--danger)}
.notice.ok{background:var(--good-soft);color:var(--good)}

/* New application */
.new-app h1{font-size:34px;font-weight:800;letter-spacing:-.035em}
.new-app .lede{color:var(--muted);max-width:60ch}

/* Open application */
.app-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.app-head h1{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.app-head .who{flex:1;min-width:0}
.app-head .who p{color:var(--muted);margin-top:4px}
details.jd{margin-bottom:14px}
details.jd summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:500}
details.jd pre{white-space:pre-wrap;font-family:var(--f-ui);font-size:13.5px;background:var(--surface);border-radius:var(--r);padding:14px;max-height:320px;overflow:auto;margin:8px 0 0}

.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.work > section{background:var(--surface);border-radius:var(--r-lg);padding:22px;min-width:0}
.doc-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.doc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-right:auto}
.doc-tabs button{border:2px solid var(--ink);background:transparent;padding:6px 16px;min-height:40px;border-radius:999px;cursor:pointer;color:var(--ink);font-weight:500;text-transform:lowercase}
.doc-tabs button[aria-selected="true"]{background:var(--tomato);border-color:var(--tomato);color:var(--on-block);font-weight:700}
.versions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.vchip{font-size:13px;font-weight:700;border:0;background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.vchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vchip.edited{outline:2px dashed var(--line);outline-offset:-2px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer;margin-left:6px}
.toggle input{accent-color:var(--accent)}

.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:16px;padding:44px 52px;font-family:var(--f-doc);font-size:15.5px;line-height:1.55;min-height:420px;overflow-wrap:anywhere}
.paper h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px}
.paper h2{display:inline-block;font-size:12.5px;font-weight:700;text-transform:lowercase;background:var(--sage);color:#1E1E1E;border-radius:999px;padding:3px 12px;margin:18px 0 8px}
.paper h3{font-size:16px;font-weight:700;margin:12px 0 2px}
.paper p{margin:0 0 9px}
.paper ul{margin:2px 0 9px;padding-left:20px}
.paper li{margin:0 0 3px}
.paper hr{border:0;border-top:1px solid #E0D9CC;margin:14px 0}
.paper a{color:#2F45C5}
.paper.cover p{margin:0 0 14px;max-width:66ch}
.paper.streaming::after{content:"";display:inline-block;width:8px;height:16px;background:#2F45C5;vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.paper.diff{white-space:pre-wrap;font-size:15px}
.paper ins{background:#DDF0E4;color:#1F5E3B;text-decoration:none;border-radius:2px}
.paper del{background:#F7E1DE;color:#8E2F28;border-radius:2px}
.paper textarea{width:100%;min-height:560px;border:0;background:transparent;font-family:var(--f-code);font-size:13.5px;line-height:1.55;resize:vertical;outline:none;color:inherit}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend ins{background:var(--good-soft);color:var(--good);text-decoration:none;padding:0 4px;border-radius:2px}
.legend del{background:var(--danger-soft);color:var(--danger);padding:0 4px;border-radius:2px}

/* Resume styles: picker row and white "printed" paper */
.paper.doc{background:#FFFFFF;color:#1B1B1B}
.style-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 12px}
.style-bar .label{margin-right:-4px}
.style-bar .chips{gap:6px}
.style-bar .chip{background:var(--bg);border:0;font-weight:500;min-height:34px;padding:6px 14px;text-transform:lowercase}
.style-bar .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.swatches{display:flex;gap:6px}
.swatch{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

/* Revision panel: the cobalt block */
.revise{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:14px}
.revise h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.revise .panel:first-child{background:#2F45C5;color:#FFFFFF}
.revise .panel:first-child .hint{color:#DCE1FA}
.revise .panel:first-child textarea.input{background:#FFFFFF;color:#1E1E1E}
.revise .panel:first-child .btn.primary{background:var(--mustard);color:#1E1E1E;min-height:52px;font-size:16px;font-weight:800}
.revise .panel:first-child .chip{background:rgba(255,255,255,.14);border:0;color:#FFFFFF}
.revise .panel:first-child .chip:hover{background:rgba(255,255,255,.26)}
.revise .panel:first-child .seg button{border-color:#FFFFFF;color:#FFFFFF}
.revise .panel:first-child .seg button[aria-pressed="true"]{background:#FFFFFF;color:#1E1E1E}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:6px 10px;min-height:40px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);text-transform:lowercase}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip:hover{background:var(--sunk)}
.history{display:flex;flex-direction:column;gap:6px;margin:0;padding:0}
.history li{list-style:none;display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:13.5px}
.history li .n{font-weight:800}
.history li button{all:unset;cursor:pointer}
.history li button:hover .t{text-decoration:underline}
.history li .t{display:block}
.history li .d{display:block;font-size:12px;color:var(--muted)}
.history ol{margin:0;padding:0}

/* Profile */
.profile{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.profile h1{font-size:34px;font-weight:800;letter-spacing:-.035em}
.drop{border:2px dashed var(--line);border-radius:var(--r-lg);padding:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bg);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block}
.drop .file{font-family:var(--f-code);font-size:12.5px;color:var(--muted)}
.resume-text{min-height:420px;font-family:var(--f-code);font-size:13px}
.aside-card{display:flex;flex-direction:column;gap:10px}
.aside-card h2{font-size:17px;font-weight:800}
.profile > .stack > .aside-card:first-child{background:var(--mustard);color:var(--on-block)}
.aside-card ul{margin:0;padding-left:18px;font-size:13.5px;color:inherit;display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.back{display:none}

@media (max-width:1100px){
  .work{grid-template-columns:minmax(0,1fr)}
  .revise{position:static}
}
@media (max-width:820px){
  .tailor{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .tailor.has-open .side{display:none}
  .tailor:not(.has-open) .main{display:none}
  .tailor.is-new .main{display:block}
  .tailor.is-new .side{display:none}
  .back{display:inline-flex}
  .profile{grid-template-columns:minmax(0,1fr)}
  .paper{padding:24px 20px}
  .work > section{padding:14px}
  .app-list{max-height:none}
  .app-head h1{font-size:30px}
  .top-in{padding:12px 16px}
  .wrap{padding:8px 16px 40px}
  .paper table.rs-cols,.paper .rs-cols tbody,.paper .rs-cols tr,.paper td.rs-side,.paper td.rs-main{display:block;width:auto!important}
  .paper td.rs-side,.paper td.rs-main{padding:8pt 10pt!important}
}
@media (prefers-reduced-motion: reduce){ .spin,.paper.streaming::after{animation:none} }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mk" aria-hidden="true"><i></i><i></i></span><b>carearz</b><small>2.0</small></div>
    <span class="save-state" id="saveState"></span>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-tailor" aria-selected="true" data-view="tailor">Applications</button>
      <button role="tab" id="tab-profile" aria-selected="false" data-view="profile">My resume</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
(() => {
"use strict";

/* ---------- Helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = t => new Date(t).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
const fmtTime = t => new Date(t).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function loadScript(src){
  return new Promise((ok, fail) => {
    if ([...document.scripts].some(s => s.src === src)) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = () => ok(); s.onerror = () => fail(new Error("Could not load " + src));
    document.head.appendChild(s);
  });
}

/* ---------- State ---------- */
const S = {
  view:"tailor",
  profile:{name:"", resume:"", extra:"", fileName:"", updatedAt:0},
  apps:[],             // {id, company, role, jd, focus, createdAt, updatedAt, versions:[...]}
  sel:null,            // open application id, or "new"
  doc:"resume",        // resume | cover | notes
  ver:null,            // index into versions; null = latest
  compare:false,
  editing:false,
  target:"both",
  busy:null,           // {appId, kind, text}
  error:"",
  draftJd:"", draftFocus:"", draftReq:"",
  keyOpen:false
};
const curApp = () => S.apps.find(a => a.id === S.sel) || null;

/* ---------- Storage: private per-person db when opened in Claude, else this browser ---------- */
const Store = {
  mode:"local", root:null, timers:{},
  local(key, val){
    try{
      if (val === undefined){ const v = localStorage.getItem("carearz2:" + key); return v ? JSON.parse(v) : null; }
      localStorage.setItem("carearz2:" + key, JSON.stringify(val));
    }catch(e){ return null; }
  },
  async init(){
    try{
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.root = db.doc("data/users/" + id + "/profile");
      this.mode = "cloud";
    }catch(e){ this.mode = "local"; }
  },
  async loadCloud(){
    const [p, a] = await Promise.all([this.root.get(), this.root.collection("apps").get()]);
    const apps = await Promise.all(a.docs.map(async d => {
      const app = {...d.data()};
      const vs = await this.root.collection("apps").doc(d.id).collection("versions").get();
      app.versions = vs.docs.map(v => ({...v.data()})).sort((x, y) => x.n - y.n);
      return app;
    }));
    return {profile: p.exists ? p.data()?.profile : null, apps};
  },
  saveProfile(){
    this.local("profile", S.profile);
    if (this.mode !== "cloud") return Promise.resolve();
    return this.root.set({profile: JSON.parse(JSON.stringify(S.profile))});
  },
  appMeta(app){ const {versions, ...meta} = app; return JSON.parse(JSON.stringify(meta)); },
  async putApp(app, newVersion){
    this.local("apps", S.apps);
    if (this.mode !== "cloud") return;
    const ref = this.root.collection("apps").doc(app.id);
    try{
      await ref.set(this.appMeta(app));
      if (newVersion) await ref.collection("versions").doc(newVersion.id).set(JSON.parse(JSON.stringify(newVersion)));
    }catch(e){ console.warn(e); toast("Couldn't save to your account. It is kept in this browser for now."); }
  },
  async delApp(app){
    this.local("apps", S.apps);
    if (this.mode !== "cloud") return;
    const ref = this.root.collection("apps").doc(app.id);
    try{
      await Promise.all(app.versions.map(v => ref.collection("versions").doc(v.id).delete()));
      await ref.delete();
    }catch(e){ console.warn(e); }
  }
};

/* ---------- Claude: inside Claude use the page's own access; elsewhere (e.g. GitHub Pages) use your own API key ---------- */
const API_MODEL = "claude-sonnet-5-5";
const Caps = {native:null, key(){ try{ return localStorage.getItem("carearz2:apikey") || localStorage.getItem("carearz:apikey") || ""; }catch(_){ return ""; } }};
async function nativeSample(){
  if (Caps.native === null) Caps.native = window.claude?.use ? (await claude.use("sample")) || false : false;
  return Caps.native || null;
}

    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "", truncated = false;
    for (;;){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines){
        if (!line.startsWith("data:")) continue;
        let ev; try{ ev = JSON.parse(line.slice(5)); }catch(_){ continue; }
        if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta"){

  };

function blocks(md){
  const out = []; let para = [], list = [];

  const flushL = () => { if (list.length){ out.push({t:"ul", items:list}); list = []; } };
  for (const raw of String(md || "").split("\n")){
    const line = raw.trimEnd();
    let m;

    if ((m = line.match(/^(#{1,3})\s+(.*)$/))){ flushP(); flushL(); out.push({t:"h" + m[1].length, text:m[2]}); continue; }

function diffHtml(a, b){
  const A = String(a || "").split(/(\s+)/), B = String(b || "").split(/(\s+)/);
  const n = A.length, m = B.length;
  if (n * m > 6e6) return esc(b);
  const dp = Array.from({length:n + 1}, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i = 0, j = 0, out = "", ins = "", del = "";
  const flush = () => { if (del) out += "<del>" + esc(del) + "</del>"; if (ins) out += "<ins>" + esc(ins) + "</ins>"; ins = del = ""; };
  while (i < n && j < m){
    if (A[i] === B[j]){ flush(); out += esc(A[i]); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) del += A[i++];
    else ins += B[j++];
  }
  while (i < n) del += A[i++];
  while (j < m) ins += B[j++];
  flush();
  return out;
}

async function readPdf(buf){
  // Loading the worker script on the page lets pdf.js run in the page itself, with no separate worker
  await loadScript(LIB.pdf); await loadScript(LIB.pdfWorker);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const pdf = await lib.getDocument({data:buf, disableWorker:true}).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const content = await (await pdf.getPage(p)).getTextContent();
    let lastY = null, line = "", lines = [];
    for (const it of content.items){
      const y = it.transform ? Math.round(it.transform[5]) : lastY;
      if (lastY !== null && Math.abs(y - lastY) > 2 && line.trim()){ lines.push(line); line = ""; }
      line += it.str; if (it.hasEOL && line.trim()){ lines.push(line); line = ""; }
      lastY = y;
    }
    if (line) lines.push(line);
    pages.push(lines.map(l => l.replace(/\s+/g, " ").trim()).join("\n"));
  }
  return pages.join("\n\n");
}

    elegant: {font:"Garamond", body:23, name:44, center:true, nameCaps:true, nameBold:false, nameSpacing:80, contactItalic:true, h2:{size:23, color:acc, smallCaps:true, characterSpacing:40, align:"center", rule:acc, ruleTop:acc}},
    bold:    {font:"Arial",    body:21, name:68, h2:{size:24, bold:true, color:"111111", rule:acc, ruleSize:24}},
    technical:{font:"Calibri", body:20, name:44, nameFont:"Consolas", nameColor:acc, contactFont:"Consolas", h2:{size:20, bold:true, color:acc, font:"Consolas", prefix:"// ", rule:"BBBBBB", ruleStyle:"DASHED"}}
  }[style] || null;
  const lk = L || {font:"Calibri", body:21, name:36, h2:{size:22, bold:true, allCaps:true}};
  const font = lk.font, size = kind === "cover" ? Math.max(lk.body, 22) : lk.body;
  const runs = (s, base = {}) => {
    const parts = []; const re = /\*\*(.+?)\*\*|\*(?!\s)(.+?)\*/g; let last = 0, m;
    const mk = (text, extra) => new D.TextRun({font, size, ...base, ...extra, text});
    while ((m = re.exec(s))){
      if (m.index > last) parts.push(mk(s.slice(last, m.index)));
      parts.push(mk(m[1] || m[2], {bold:!!m[1] || base.bold, italics:!!m[2]}));
      last = re.lastIndex;
    }
    if (last < s.length) parts.push(mk(s.slice(last)));
    return parts;
  };
  const strip = s => s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
  const h2 = text => {
    const h = lk.h2;
    return new D.Paragraph({
      alignment:h.align === "center" ? D.AlignmentType.CENTER : undefined,
      children:runs((h.prefix || "") + strip(text), {size:h.size, bold:!!h.bold, color:h.color, allCaps:h.allCaps, smallCaps:h.smallCaps, characterSpacing:h.characterSpacing, ...(h.font ? {font:h.font} : {})}),
      spacing:{before:style === "compact" ? 140 : 220, after:80},
      shading:h.fill ? {type:D.ShadingType.CLEAR, color:"auto", fill:h.fill} : undefined,
      border:h.rule ? {bottom:{color:h.rule, space:1, style:D.BorderStyle[h.ruleStyle || "SINGLE"], size:h.ruleSize || 6}, ...(h.ruleTop ? {top:{color:h.ruleTop, space:1, style:D.BorderStyle.SINGLE, size:6}} : {})} : undefined
    });
  };
  const para = blocksList => {
    const out = [];
    for (const b of blocksList){
      if (b.t === "h1") out.push(new D.Paragraph({children:runs(strip(b.text), {bold:true, size:lk.name}), spacing:{after:40}}));
      else if (b.t === "h2") out.push(h2(b.text));
      else if (b.t === "h3") out.push(new D.Paragraph({children:runs(strip(b.text), {bold:style !== "minimal", italics:style === "minimal", size:size + 1}), spacing:{before:120, after:40}}));
      else if (b.t === "ul") for (const it of b.items) out.push(new D.Paragraph({children:runs(strip(it)), bullet:{level:0}, spacing:{after:40}}));
      else if (b.t === "hr") out.push(new D.Paragraph({children:[]}));
      else out.push(new D.Paragraph({children:runs(strip(b.text)), spacing:{after: kind === "cover" ? 200 : 80}}));
    }
    return out.length ? out : [new D.Paragraph({children:[]})];
  };
  const kids = [];
  const d = docParts(md);
  if (d.name && L){
    const align = lk.center ? D.AlignmentType.CENTER : undefined;
    const fill = lk.nameFill ? {type:D.ShadingType.CLEAR, color:"auto", fill:lk.nameFill} : undefined;
    const rule = lk.nameRule ? {bottom:{color:lk.nameRule.color, space:6, style:D.BorderStyle.SINGLE, size:lk.nameRule.size}}
      : style === "sidebar" ? {bottom:{color:acc, space:6, style:D.BorderStyle.SINGLE, size:12}} : undefined;
    const pad = fill ? {left:240, right:240} : undefined;
    kids.push(new D.Paragraph({alignment:align, shading:fill, indent:pad, children:runs(strip(d.name), {bold:lk.nameBold ?? (style !== "classic" && style !== "minimal"), size:lk.name, color:lk.nameColor, allCaps:lk.nameCaps, characterSpacing:lk.nameSpacing, ...(lk.nameFont ? {font:lk.nameFont} : {})}), spacing:{before:fill ? 0 : 0, after:d.contact.length ? (fill ? 0 : 40) : 200}, border:d.contact.length ? undefined : rule}));
    if (d.contact.length) kids.push(new D.Paragraph({alignment:align, shading:fill, indent:pad, children:d.contact.flatMap((c, i) => [...(i ? [new D.TextRun({break:1})] : []), ...runs(strip(c), {size:size - 2, color:lk.contactColor || "555555", italics:!!lk.contactItalic, ...(lk.contactFont ? {font:lk.contactFont} : {})})]), spacing:{after:200}, border:rule}));
  }
  const body = d.name && L ? d.body : md;
  if (kind === "resume" && style === "sidebar"){
    const none = {style:D.BorderStyle.NONE, size:0, color:"FFFFFF"};
    const cellBorders = {top:none, bottom:none, left:none, right:none};
    kids.push(new D.Table({
      width:{size:100, type:D.WidthType.PERCENTAGE},
      borders:{top:none, bottom:none, left:none, right:none, insideHorizontal:none, insideVertical:none},
      rows:[new D.TableRow({children:[
        new D.TableCell({width:{size:32, type:D.WidthType.PERCENTAGE}, borders:cellBorders, shading:{type:D.ShadingType.CLEAR, color:"auto", fill:tint}, margins:{top:120, bottom:120, left:160, right:160}, children:para(blocks(d.side))}),
        new D.TableCell({width:{size:68, type:D.WidthType.PERCENTAGE}, borders:cellBorders, margins:{left:280}, children:para(blocks(d.main))})
      ]})]
    }));
  } else kids.push(...para(blocks(body)));
  const doc = new D.Document({sections:[{properties:{page:{margin:{top:900, bottom:900, left:1000, right:1000}}}, children:kids}]});
  return D.Packer.toBlob(doc);
}
// PDF: print just the styled document from a hidden frame; the browser's "Save as PDF" keeps real, selectable text
function printPdf(app, text, kind){
  const old = document.getElementById("pdf-frame"); if (old) old.remove();
  const f = document.createElement("iframe");
  f.id = "pdf-frame"; f.title = "PDF"; f.setAttribute("aria-hidden", "true");
  f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
  const name = fileBase(app, kind);
  f.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(name)}</title><style>@page{size:letter;margin:0.6in}html,body{margin:0;background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}${styleCSS(appStyle(app), appAccent(app), "")}.rs h2,.rs h3{break-after:avoid}.rs li{break-inside:avoid}</style></head><body>${styledDoc(text, kind, appStyle(app))}</body></html>`;
  f.onload = () => {
    const w = f.contentWindow, prevTitle = document.title;
    document.title = name; // some browsers name the PDF after the top page's title
    const done = () => { document.title = prevTitle; setTimeout(() => f.remove(), 500); };
    w.addEventListener("afterprint", done, {once:true});
    try{ w.focus(); w.print(); toast('Choose "Save as PDF" in the print window'); }
    catch(_){ done(); toast("This browser blocked printing here. Use Word instead, or open the app in its own tab."); }
  };
  document.body.appendChild(f);
}
function fileBase(app, kind){
  const who = (S.profile.name || "").trim();
  const parts = [who, app.company, kind === "cover" ? "Cover letter" : kind === "notes" ? "Fit notes" : "Resume"].filter(Boolean);
  return parts.join(" - ").replace(/[\\/:*?"<>|]+/g, "").slice(0, 120);
}

/* ---------- Generation ---------- */
let aborter = null;
async function generate(){
  const jd = S.draftJd.trim();
  if (!S.profile.resume.trim()){ S.error = "Add your base resume under My resume first."; return render(); }
  if (jd.length < 80){ S.error = "Paste the full job description, including the responsibilities and requirements."; return render(); }
  const sample = await getSample();
  if (!sample){ S.error = "To generate here, add your Claude API key under My resume. Inside the Claude app this works without a key."; return render(); }
  const app = {id:uid(), company:"", role:"", jd, focus:S.draftFocus.trim(), createdAt:Date.now(), updatedAt:Date.now(), versions:[]};
  S.apps.unshift(app); S.sel = app.id; S.doc = "resume"; S.ver = null; S.compare = false; S.editing = false; S.error = "";
  S.busy = {appId:app.id, kind:"generate", text:""};
  render();
  aborter = new AbortController();
  try{
    const {text, truncated} = await sample(genPrompt(S.profile, jd, app.focus), {
      signal:aborter.signal, cache:false, modelTier:"default",
      onText:({text}) => { S.busy.text = text; paintStream(); }
    });
    const resume = tag(text, "resume"), cover = tag(text, "cover_letter");
    if (!resume || !cover) throw {code:"upstream_error", message: truncated ? "The reply was cut off." : "The reply was missing a document."};
    app.company = tag(text, "company") || "Untitled company";
    app.role = tag(text, "role") || "Role";
    const v = {id:uid(), n:1, resume, cover, notes:tag(text, "notes"), request:"", target:"both", by:"claude", at:Date.now()};
    app.versions.push(v); app.updatedAt = v.at;
    S.draftJd = ""; S.draftFocus = "";
    Store.putApp(app, v);
  }catch(e){
    S.apps = S.apps.filter(a => a !== app); S.sel = "new"; S.error = errText(e);
  }finally{ S.busy = null; aborter = null; render(); }
}

async function revise(request){
  const app = curApp(); if (!app) return;
  request = request.trim();
  if (!request){ S.error = "Say what you'd like changed."; return render(); }
  const sample = await getSample();
  if (!sample){ S.error = "To revise here, add your Claude API key under My resume."; return render(); }
  const base = S.ver === null ? app.versions[app.versions.length - 1] : app.versions[S.ver];
  const target = S.target;
  S.busy = {appId:app.id, kind:"revise", text:"", target}; S.error = ""; S.editing = false; S.compare = false; S.ver = null;
  if (target === "resume") S.doc = "resume"; else if (target === "cover") S.doc = "cover"; else if (S.doc === "notes") S.doc = "resume";
  render();
  aborter = new AbortController();
  try{
    const {text, truncated} = await sample(revisePrompt(S.profile, app, base, request, target), {
      signal:aborter.signal, cache:false, modelTier:"default",
      onText:({text}) => { S.busy.text = text; paintStream(); }
    });
    const resume = target === "cover" ? base.resume : tag(text, "resume");
    const cover = target === "resume" ? base.cover : tag(text, "cover_letter");
    if (!resume || !cover) throw {code:"upstream_error", message: truncated ? "The reply was cut off." : "The reply was missing a document."};
    const v = {id:uid(), n:app.versions.length + 1, resume, cover, notes:base.notes, request, summary:tag(text, "summary"), target, by:"claude", at:Date.now(), from:base.n};
    app.versions.push(v); app.updatedAt = v.at;
    S.draftReq = "";
    Store.putApp(app, v);
    S.apps.sort((a, b) => b.updatedAt - a.updatedAt);
  }catch(e){ S.error = errText(e); }
  finally{ S.busy = null; aborter = null; render(); }
}

function saveManualEdit(text){
  const app = curApp(); if (!app) return;
  const base = S.ver === null ? app.versions[app.versions.length - 1] : app.versions[S.ver];
  const key = S.doc === "cover" ? "cover" : "resume";
  if (text.trim() === base[key].trim()){ S.editing = false; return render(); }
  const v = {...base, id:uid(), n:app.versions.length + 1, [key]:text, request:"", summary:`Edited the ${key === "cover" ? "cover letter" : "resume"} by hand`, target:key, by:"you", at:Date.now(), from:base.n};
  app.versions.push(v); app.updatedAt = v.at;
  S.editing = false; S.ver = null;
  Store.putApp(app, v);
  toast("Saved as v" + v.n);
  render();
}

function streamingDoc(){
  const t = S.busy.text;
  if (S.busy.kind === "generate"){
    if (hasTag(t, "cover_letter") && S.doc === "cover") return {kind:"cover", md:tag(t, "cover_letter")};
    if (hasTag(t, "resume")) return {kind:"resume", md:tag(t, "resume")};
    return {kind:"resume", md:""};
  }
  if (S.busy.target === "cover" || (S.busy.target === "both" && hasTag(t, "cover_letter") && S.doc === "cover")) return {kind:"cover", md:tag(t, "cover_letter")};
  return {kind:"resume", md:tag(t, "resume")};
}

      </div>
      ${vs.length && !busy ? `<div class="versions"><span class="label" style="margin-right:4px">Version</span>${chips}
        ${prev && S.doc !== "notes" && !S.editing ? `<label class="toggle"><input type="checkbox" id="compare" ${S.compare ? "checked" : ""}> Show changes from v${prev.n}</label>` : ""}</div>` : ""}
      ${body}
    </section>
    <aside class="revise">
      <section class="panel stack">
        <h2>Ask for changes</h2>
        <div class="seg" role="group" aria-label="Apply to">
          ${[["both","Both"],["resume","Resume"],["cover","Cover letter"]].map(([k, l]) => `<button data-target="${k}" aria-pressed="${S.target === k}">${l}</button>`).join("")}
        </div>
        <textarea class="input" id="req" rows="4" placeholder="e.g. Put the data analysis project first and mention I can start in two weeks">${esc(S.draftReq)}</textarea>
        <div class="chips">${QUICK.map(q => `<button class="chip" data-quick="${esc(q)}">${esc(q)}</button>`).join("")}</div>
        <button class="btn primary" data-act="revise" ${busy || !v ? "disabled" : ""}>${busy ? '<span class="spin"></span> Working…' : `Revise${S.ver !== null && S.ver !== vs.length - 1 ? " from v" + v.n : ""}`}</button>
        <p class="hint">Each revision is saved as a new version, so you can always go back.</p>
      </section>
      ${vs.length ? `<section class="panel stack"><h2>History</h2><ol class="history">${history}</ol></section>` : ""}
    </aside>
  </div>`;
}

// Repaint only the document while Claude is writing, so typing in the side panel isn't interrupted
function paintStream(){
  const el = $("#paper");
  if (!el || !S.busy) return;
  const s = streamingDoc();
  el.classList.toggle("cover", s.kind === "cover");
  if (s.md) el.innerHTML = styledDoc(s.md, s.kind, appStyle(curApp()));
}

/* ---------- Events ---------- */
function wire(){
  const on = (sel, ev, fn) => $$(sel, root).forEach(el => el.addEventListener(ev, fn));
  // keep drafts as people type
  const jd = $("#jd"), focus = $("#focus"), req = $("#req");
  jd?.addEventListener("input", () => { S.draftJd = jd.value; Store.local("draft", {jd:S.draftJd, focus:S.draftFocus}); });
  focus?.addEventListener("input", () => { S.draftFocus = focus.value; Store.local("draft", {jd:S.draftJd, focus:S.draftFocus}); });
  req?.addEventListener("input", () => { S.draftReq = req.value; });
  req?.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) revise(req.value); });

  on("[data-open]", "click", e => { S.sel = e.currentTarget.dataset.open; S.ver = null; S.compare = false; S.editing = false; S.error = ""; render(); window.scrollTo(0, 0); });
  on("[data-doc]", "click", e => { S.doc = e.currentTarget.dataset.doc; S.editing = false; render(); });
  on("[data-ver]", "click", e => { const i = +e.currentTarget.dataset.ver; const app = curApp(); S.ver = i === app.versions.length - 1 ? null : i; S.editing = false; render(); });
  on("[data-rstyle], [data-raccent]", "click", e => {
    const app = curApp(); if (!app) return;
    const t = e.currentTarget;
    if (t.dataset.rstyle) app.style = S.profile.resumeStyle = t.dataset.rstyle;
    if (t.dataset.raccent) app.accent = S.profile.resumeAccent = t.dataset.raccent;
    Store.putApp(app); Store.saveProfile().catch(() => {});
    render();
  });
  on("[data-target]", "click", e => { S.target = e.currentTarget.dataset.target; render(); });
  on("[data-quick]", "click", e => {
    const q = e.currentTarget.dataset.quick;
    S.draftReq = S.draftReq.trim() ? S.draftReq.trim().replace(/[.]?$/, ". ") + q : q;
    render(); $("#req")?.focus();
  });
  $("#compare")?.addEventListener("change", e => { S.compare = e.target.checked; render(); });

  on("[data-act]", "click", async e => {
    const act = e.currentTarget.dataset.act;
    const app = curApp();
    const v = app ? (S.ver === null ? app.versions[app.versions.length - 1] : app.versions[S.ver]) : null;
    const text = v ? (S.doc === "cover" ? v.cover : v.resume) : "";
    switch (act){
      case "new": S.sel = "new"; S.error = ""; return render();
      case "list": S.sel = null; S.error = ""; return render();
      case "go-profile": S.view = "profile"; return render();
      case "generate": return generate();
      case "revise": return revise(S.draftReq);
      case "stop": aborter?.abort(); return;
      case "edit": S.editing = true; S.compare = false; return render();
      case "cancel-edit": S.editing = false; return render();
      case "save-edit": return saveManualEdit($("#editor").value);
      case "copy":
        try{ await navigator.clipboard.writeText(text); toast("Copied"); }
        catch(_){ toast("Couldn't copy. Use Edit and select the text instead."); }
        return;
      case "dl-md": case "dl-docx": {
        try{
          const dl = await getDownloads();
          const docx = act === "dl-docx";
          const data = docx ? await toDocx(text, S.doc, appStyle(app), appAccent(app)) : text;
          const r = await dl.save({filename:fileBase(app, S.doc) + (docx ? ".docx" : ".md"), data});
          if (r?.status === "saved" || r === undefined) toast("Downloaded");
        }catch(err){ if (err?.code !== "declined") toast(err?.code === "unavailable" ? "Downloads aren't available here. Use Copy instead." : "Couldn't create the file. Use Copy instead."); }
        return;
      }
      case "dl-pdf": return printPdf(app, text, S.doc);
      case "delete":
        $("#confirmDel").innerHTML = `<div class="notice err row" style="margin-bottom:12px">Delete ${esc(app.company)} and all ${app.versions.length} version${app.versions.length === 1 ? "" : "s"}? <button class="btn sm danger" data-confirm="yes">Delete</button><button class="btn sm ghost" data-confirm="no">Keep</button></div>`;
        $$("[data-confirm]").forEach(b => b.addEventListener("click", () => {
          if (b.dataset.confirm === "yes"){ S.apps = S.apps.filter(a => a !== app); S.sel = null; Store.delApp(app); toast("Deleted"); render(); }
          else $("#confirmDel").innerHTML = "";
        }));
        return;
      case "save-profile": {
        S.profile.name = $("#pname").value.trim();
        S.profile.resume = tidy($("#ptext").value);
        S.profile.extra = $("#pextra").value.trim();
        S.profile.updatedAt = Date.now();
        try{ await Store.saveProfile(); toast("Saved to your profile"); }
        catch(err){ console.warn(err); toast("Saved in this browser. Couldn't reach your account."); }
        return render();
      }
      case "save-key": try{ localStorage.setItem("carearz2:apikey", $("#apiKey").value.trim()); toast("Key saved in this browser"); }catch(_){ toast("This browser blocked saving the key."); } return render();
      case "clear-key": try{ localStorage.removeItem("carearz2:apikey"); localStorage.removeItem("carearz:apikey"); }catch(_){} return render();
    }
  });

  // Resume upload
  const file = $("#file"), drop = $("#drop");
  const take = async f => {
    if (!f) return;
    const st = $("#pstatus"); st.innerHTML = '<span class="spin"></span> Reading ' + esc(f.name) + "…";
    try{
      const text = tidy(await readResumeFile(f));
      if (text.length < 200) throw new Error("Couldn't find much text in that file. If it's a scanned image, paste the text instead.");
      S.profile.resume = text; S.profile.fileName = f.name; S.profile.updatedAt = Date.now();
      if (!S.profile.name){ const first = text.split("\n").find(l => l.trim()); if (first && first.length < 60 && !/@|\d{3}/.test(first)) S.profile.name = first.replace(/^#\s*/, "").trim(); }
      try{ await Store.saveProfile(); }catch(_){}
      render();
      $("#pstatus").textContent = "Read " + f.name + " and saved it to your profile. Check the text below.";
    }catch(err){ st.textContent = err.message || "Couldn't read that file."; }
  };
  file?.addEventListener("change", () => take(file.files[0]));
  if (drop){
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files[0]); });
  }
}

$$(".tabs button").forEach(b => b.addEventListener("click", () => { S.touched = true; S.view = b.dataset.view; S.error = ""; render(); }));

/* ---------- Boot ---------- */
async function boot(){
  const p = Store.local("profile"); if (p) S.profile = {...S.profile, ...p};
  const a = Store.local("apps"); if (Array.isArray(a)) S.apps = a;
  const d = Store.local("draft"); if (d){ S.draftJd = d.jd || ""; S.draftFocus = d.focus || ""; }
  if (!S.profile.resume) S.view = "profile";
  render();
  await Store.init();
  if (Store.mode === "cloud"){
    try{
      const c = await Store.loadCloud();
      if (c.profile) S.profile = {...S.profile, ...c.profile};
      else if (S.profile.resume) Store.saveProfile().catch(() => {});
      if (c.apps.length) S.apps = c.apps.sort((x, y) => y.updatedAt - x.updatedAt);
      if (S.profile.resume && S.view === "profile" && !S.touched) S.view = "tailor";
    }catch(e){ console.warn(e); Store.mode = "local"; }
  }
  await nativeSample();
  if (!S.busy) render();
}
boot();
})();
</script>
